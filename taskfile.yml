version: "3"

# Markdown is handled by prettier; JSON by biome (`check` is format + lint in one
# pass). Both honor .gitignore, so scope follows what git tracks.
#
# `default` is the pre-commit command, so it ends with the two things that can
# actually fail: the test suite, and re-executing the code blocks in whichever
# standing documents have any. A task runner that only formats exits 0 without
# checking anything.

tasks:
  default:
    desc: Format, lint, test, and verify the standing documents
    cmds:
      - task: format:md
      - task: format:json
      - task: test
      - task: verify:docs

  format:md:
    desc: Format markdown with prettier
    cmds:
      - bunx prettier --write "**/*.md"

  format:json:
    desc: Format and lint JSON with biome
    cmds:
      - bunx biome check --write .

  test:
    desc: Run the test suites
    cmds:
      - skills/obsidian-gate/tests/exit-codes.sh
      - tests/statusline.sh

  verify:docs:
    desc: Re-run the code blocks in whichever standing documents have any
    cmds:
      # `|| exit 1` rather than `&&`: a bare loop returns the LAST command's
      # status, so a failure on WALKTHROUGH.md would be masked by THEORY.md
      # passing after it.
      #
      # A document with no fenced blocks is skipped out loud, not verified.
      # `showboat verify` re-executes code blocks and nothing else, so on a
      # prose-only file it exits 0 against any content whatsoever -- including
      # content that is wrong. THEORY.md has never held a block and drifted
      # twelve commits under a green check from this very target. Skipping it
      # silently would report the same absent coverage more quietly, so the
      # skip prints.
      - |
        for f in WALKTHROUGH.md THEORY.md; do
          [ -f "$f" ] || continue
          if grep -q '^```' "$f"; then
            uvx showboat verify "$f" || exit 1
          else
            echo "verify:docs: skipping $f -- no code blocks; its prose is unchecked"
          fi
        done
