version: "3"

# Markdown is handled by prettier; JSON by biome (`check` is format + lint in one
# pass). Both honor .gitignore, so scope follows what git tracks.
#
# `default` is the pre-commit command, so it ends with the one thing that can
# actually fail: the test suite. A task runner that only formats exits 0 without
# checking anything.
#
# There was a `verify:docs` target here that re-executed the code blocks in
# WALKTHROUGH.md and THEORY.md via showboat. It is gone with showboat itself --
# those documents are ordinary markdown now. It is worth recording why it was
# not replaced rather than merely removed: its own comment admitted that
# THEORY.md "has never held a block and drifted twelve commits under a green
# check from this very target." Re-executing code blocks never checked the
# prose, which is where the drift lives. Staleness is reported at release time
# by `release-gate` check 8, and correctness by reading.

tasks:
  default:
    desc: Format, lint, and test
    cmds:
      - task: format:md
      - task: format:json
      - task: test

  format:md:
    desc: Format markdown with prettier
    cmds:
      - bunx prettier --write "**/*.md"

  format:json:
    desc: Format and lint JSON with biome
    cmds:
      - bunx biome check --write .

  test:
    desc: Run the test suites
    cmds:
      - skills/release-gate/tests/exit-codes.sh
      - skills/issue-pr/tests/pr-cycle.sh
      - tests/statusline.sh
